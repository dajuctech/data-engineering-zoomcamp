version: 2

sources:
  - name: raw
    description: Raw taxi trip data from NYC TLC
    database: taxi_rides_ny
    schema: prod

    tables:
      - name: green_tripdata
        description: Raw green taxi trip data
        columns:
          - name: vendorid
            description: |
              A code indicating the provider associated with the trip record.
              1: 'Creative Mobile Technologies'
              2: 'VeriFone Inc.'
              4: 'Unknown/Other'
            data_type: integer
            meta:
              pii: false
              ownership: data_team
              importance: high
              formatting: none

      - name: yellow_tripdata
        description: Raw yellow taxi trip data

      - name: fhv_tripdata
        description: Raw for-hire vehicle trip data
